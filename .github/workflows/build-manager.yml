name: Build Manager (debug)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'manager/**'
      - 'userspace/**'
      - 'kernel/**'
      - 'uapi/**'
      - 'scripts/**'
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
  pull_request:
    paths:
      - 'manager/**'
      - 'userspace/**'
      - 'kernel/**'
      - 'uapi/**'
      - '.github/workflows/build-manager.yml'

jobs:
  build-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK (preinstalled)
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          [ -d "$SDK" ] || SDK=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          test -n "$SDKM" || { echo "sdkmanager not found under $SDK"; exit 1; }
          echo "SDKMANAGER=$SDKM" >> "$GITHUB_ENV"

      - name: Install Android SDK components
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "build-tools;36.1.0" \
            "cmake;4.1.0" \
            "ndk;29.0.14206865" \
            "platforms;android-37.0" >/dev/null
          # AGP asks for "platforms/android-37"; API 37 ships as android-37.0
          ln -sfn android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          ls "$ANDROID_SDK_ROOT/platforms"
      - name: Setup Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Build ksud
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          NDKBIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDKBIN/aarch64-linux-android29-clang"
          export CXX_aarch64_linux_android="$NDKBIN/aarch64-linux-android29-clang++"
          export AR_aarch64_linux_android="$NDKBIN/llvm-ar"
          cargo +nightly build --target aarch64-linux-android --release \
            --manifest-path userspace/ksud/Cargo.toml
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          cp userspace/ksud/target/aarch64-linux-android/release/ksud \
             manager/app/src/main/jniLibs/arm64-v8a/libksud.so

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > manager/local.properties
          cd manager
          ./gradlew :app:assembleDebug --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NekoSU-debug-apk
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
