name: Build LKM

on:
  workflow_dispatch:
    inputs:
      kmis:
        description: 'KMI list (space separated)'
        required: false
        default: 'android14-6.1 android15-6.6 android16-6.12 android17-6.18'
      expected_size:
        description: 'Manager cert DER size (KSU_EXPECTED_SIZE)'
        required: false
        default: ''
      expected_hash:
        description: 'Manager cert DER sha256 (KSU_EXPECTED_HASH)'
        required: false
        default: ''
  workflow_call:
    inputs:
      kmis:
        required: false
        type: string
        default: 'android14-6.1 android15-6.6 android16-6.12 android17-6.18'
      expected_size:
        required: false
        type: string
        default: ''
      expected_hash:
        required: false
        type: string
        default: ''

jobs:
  build-lkm:
    runs-on: ubuntu-latest
    env:
      KSU_EXPECTED_SIZE: ${{ inputs.expected_size || secrets.KSU_EXPECTED_SIZE }}
      KSU_EXPECTED_HASH: ${{ inputs.expected_hash || secrets.KSU_EXPECTED_HASH }}
      CLANG_BIN: /usr/lib/llvm-18/bin
      DDK_PREBUILTS: ${{ runner.temp }}/ddk-prebuilts
      DDK_WORK: ${{ runner.temp }}/ddk-work
      KMI_LOGDIR: ${{ runner.temp }}/kmi-logs
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-lfs zstd clang-18 lld-18 llvm-18 libdw-dev libdwarf-dev libelf-dev \
            zlib1g-dev python3 build-essential
          git lfs install

      - name: Validate signing values
        run: |
          test -n "$KSU_EXPECTED_SIZE" || { echo "KSU_EXPECTED_SIZE is required (repo secret or workflow input)"; exit 1; }
          test -n "$KSU_EXPECTED_HASH" || { echo "KSU_EXPECTED_HASH is required (repo secret or workflow input)"; exit 1; }

      - name: Clone DDK prebuilt images (git-lfs)
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 https://cnb.cool/Ylarod/ddk-prebuilts.git "$DDK_PREBUILTS" \
            || git clone --depth 1 https://github.com/Ylarod/ddk-prebuilts.git "$DDK_PREBUILTS"
          cd "$DDK_PREBUILTS"
          git lfs install --local
          # scripts/build_kmi.sh pulls only the requested KMI images on demand

      - name: Build each KMI
        run: |
          set -e
          for kmi in ${{ inputs.kmis }}; do
            echo "==== $kmi ===="
            scripts/build_kmi.sh "$kmi"
          done
          ls -l userspace/ksud/bin/aarch64/*.ko

      - name: Upload LKM assets
        uses: actions/upload-artifact@v4
        with:
          name: lkm-assets
          path: userspace/ksud/bin/aarch64/*.ko
          if-no-files-found: error
