name: Build LKM

on:
  workflow_dispatch:
    inputs:
      kmis:
        description: 'KMI list (JSON array)'
        required: false
        default: '["android14-6.1","android15-6.6","android16-6.12","android17-6.18"]'
      expected_size:
        description: 'Manager cert DER size (KSU_EXPECTED_SIZE)'
        required: false
        default: ''
      expected_hash:
        description: 'Manager cert DER sha256 (KSU_EXPECTED_HASH)'
        required: false
        default: ''
  workflow_call:
    inputs:
      kmis:
        required: false
        type: string
        default: '["android14-6.1","android15-6.6","android16-6.12","android17-6.18"]'
      expected_size:
        required: false
        type: string
        default: ''
      expected_hash:
        required: false
        type: string
        default: ''

jobs:
  build-lkm:
    name: LKM ${{ matrix.kmi }}
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJSON(inputs.kmis) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    env:
      KSU_EXPECTED_SIZE: ${{ inputs.expected_size || secrets.KSU_EXPECTED_SIZE }}
      KSU_EXPECTED_HASH: ${{ inputs.expected_hash || secrets.KSU_EXPECTED_HASH }}
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate signing values
        run: |
          test -n "$KSU_EXPECTED_SIZE" || { echo "KSU_EXPECTED_SIZE is required (repo secret or input)"; exit 1; }
          test -n "$KSU_EXPECTED_HASH" || { echo "KSU_EXPECTED_HASH is required (repo secret or input)"; exit 1; }

      - name: Clone SUSFS LKM source
        run: git clone --depth 1 https://github.com/inforcqb/susfs4ksu-lkm.git /tmp/susfs-lkm

      - name: Build kernelsu.ko and SUSFS ko
        run: |
          set +e
          export SUSFS_SRC=/tmp/susfs-lkm
          export SKIP_PREBUILT_FETCH=1
          export DDK_WORK=/opt/ddk
          export KMI_LOGDIR=/tmp/kmi-logs
          export CLANG_BIN="$(dirname "$(command -v clang)")"
          scripts/build_kmi.sh "${{ matrix.kmi }}"
          rc=$?
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -f userspace/ksud/bin/aarch64/${{ matrix.kmi }}_*.ko "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          ls -l "$GITHUB_WORKSPACE/out" || true
          exit $rc

      - name: Upload LKM assets
        uses: actions/upload-artifact@v4
        with:
          name: lkm-${{ matrix.kmi }}
          path: ${{ github.workspace }}/out/*.ko
          if-no-files-found: error
