name: Build LKM

on:
  workflow_dispatch:
    inputs:
      kmis:
        description: 'KMI list (JSON array)'
        required: false
        default: '["android12-5.10","android13-5.10","android13-5.15","android14-5.15","android14-6.1","android15-6.6","android16-6.12","android17-6.18"]'
      expected_size:
        description: 'Manager cert DER size (KSU_EXPECTED_SIZE)'
        required: false
        default: ''
      expected_hash:
        description: 'Manager cert DER sha256 (KSU_EXPECTED_HASH)'
        required: false
        default: ''
  workflow_call:
    inputs:
      kmis:
        required: false
        type: string
        default: '["android12-5.10","android13-5.10","android13-5.15","android14-5.15","android14-6.1","android15-6.6","android16-6.12","android17-6.18"]'
      expected_size:
        required: false
        type: string
        default: ''
      expected_hash:
        required: false
        type: string
        default: ''

jobs:
  build-lkm:
    name: LKM ${{ matrix.kmi }}
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJSON(inputs.kmis) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    env:
      KSU_EXPECTED_SIZE: ${{ inputs.expected_size || secrets.KSU_EXPECTED_SIZE }}
      KSU_EXPECTED_HASH: ${{ inputs.expected_hash || secrets.KSU_EXPECTED_HASH }}
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate signing values
        run: |
          test -n "$KSU_EXPECTED_SIZE" || { echo "KSU_EXPECTED_SIZE is required (repo secret or input)"; exit 1; }
          test -n "$KSU_EXPECTED_HASH" || { echo "KSU_EXPECTED_HASH is required (repo secret or input)"; exit 1; }

      - name: Build kernelsu.ko (kernel/Makefile, same as upstream DDK CI)
        run: |
          set -e
          cd kernel
          CONFIG_KSU=m \
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y \
          CONFIG_KSU_TRACEPOINT_HOOK=y \
          KSU_EXPECTED_SIZE="$KSU_EXPECTED_SIZE" \
          KSU_EXPECTED_HASH="$KSU_EXPECTED_HASH" \
          CC=clang make
          KMI="${{ matrix.kmi }}"
          OUT_DIR="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT_DIR"
          cp kernelsu.ko "$OUT_DIR/${KMI}_kernelsu.ko"
          llvm-strip -d "$OUT_DIR/${KMI}_kernelsu.ko"
          ls -l "$OUT_DIR/${KMI}_kernelsu.ko"

      - name: Build SUSFS ko (LKM)
        run: |
          set -e
          KMI="${{ matrix.kmi }}"
          git clone --depth 1 https://github.com/inforcqb/susfs4ksu-lkm.git /tmp/susfs-lkm
          SRCK=/tmp/susfs-lkm/kernel
          KDIR="${KDIR:-/opt/ddk/kdir/$KMI}"
          SOUT=/tmp/susfs-out
          rm -rf "$SOUT"; mkdir -p "$SOUT"
          case "$KMI" in
            android16-6.12|android17-6.18)
              make -C "$KDIR" M="$SRCK" MO="$SOUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                KBUILD_MODPOST_WARN=1 modules -j"$(nproc)" ;;
            *)
              make -C "$KDIR" M="$SRCK" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                KBUILD_MODPOST_WARN=1 modules -j"$(nproc)" ;;
          esac
          KO=$(ls "$SOUT/susfs_guard_lkm.ko" "$SRCK/susfs_guard_lkm.ko" 2>/dev/null | head -1)
          test -n "$KO"
          OUT_DIR="$GITHUB_WORKSPACE/out"
          cp "$KO" "$OUT_DIR/${KMI}_susfs_guard_lkm.ko"
          llvm-strip -d "$OUT_DIR/${KMI}_susfs_guard_lkm.ko"

      - name: Upload LKM assets
        uses: actions/upload-artifact@v4
        with:
          name: lkm-${{ matrix.kmi }}
          path: ${{ github.workspace }}/out/*.ko
          if-no-files-found: error
