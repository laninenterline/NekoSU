<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NekoSU WebUI (Compose Multiplatform)</title>
<style>
  html,body{margin:0;padding:0;background:#141218;color:#e6e0e9;height:100%;font-family:system-ui,sans-serif}
  canvas{width:100%;height:100%;display:block}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;z-index:10;text-align:center;padding:24px}
  #loading small{color:#cac4d0;max-width:520px;line-height:1.6}
  #error{color:#f2b8b5;max-width:640px;white-space:pre-wrap;text-align:left;font-size:13px}
  .spinner{width:36px;height:36px;border:3px solid #49454f;border-top-color:#d0bcff;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div>正在加载 Compose Multiplatform（WebAssembly）…</div>
  <small>首次加载约 10 MB wasm，需要几秒；若长时间空白请把下方错误信息发给我。</small>
  <div id="error"></div>
</div>
<script>
  const errBox = document.getElementById('error');
  window.addEventListener('error', (event) => {
    errBox.textContent += (event.message || String(event.error || event)) + '\n';
  });
  window.addEventListener('unhandledrejection', (event) => {
    errBox.textContent += 'Promise: ' + (event.reason?.message || String(event.reason)) + '\n';
  });
  const started = Date.now();
  const timer = setInterval(() => {
    if (document.querySelector('canvas')) {
      document.getElementById('loading').style.display = 'none';
      clearInterval(timer);
    } else if (Date.now() - started > 20000) {
      errBox.textContent += '20 秒内未创建 canvas：浏览器可能不支持 WebGL2/WebAssembly GC，或 wasm 加载失败。\n';
      clearInterval(timer);
    }
  }, 300);
</script>
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
