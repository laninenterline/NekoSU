<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NekoSU 镜像</title>
<style>
html,body{margin:0;height:100%;background:#0f1115;color:#e6e9ef;font:14px system-ui}
#wrap{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #272d37;background:#161a21}
header b{color:#7aa2ff}
#stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#mirror{max-width:100%;max-height:100%;touch-action:none;cursor:crosshair;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:8px}
#hint{position:absolute;left:12px;bottom:10px;color:#98a0ae;font-size:12px;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:8px}
button{font:inherit;background:#1c2129;color:#e6e9ef;border:1px solid #272d37;border-radius:8px;padding:6px 12px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <b>NekoSU 镜像</b>
    <span id="state" style="color:#98a0ae">连接中…</span>
    <span style="flex:1"></span>
    <button onclick="location.reload()">重连</button>
    <button onclick="history.back()">返回</button>
  </header>
  <div id="stage">
    <img id="mirror" alt="mirror">
    <div id="hint">点击 = 触摸，拖动 = 滑动；画面就是设备上的真实 UI</div>
  </div>
</div>
<script>
const token = new URLSearchParams(location.search).get('token') || window.NEKO_WEBUI?.token || '';
const img = document.getElementById('mirror');
const state = document.getElementById('state');
img.src = '/screen.mjpg?token=' + encodeURIComponent(token);
img.onload = () => { state.textContent = '已连接（实时）'; };
img.onerror = () => { state.textContent = '镜像未开启或已断开'; };

let start = null;
img.addEventListener('pointerdown', (e) => {
  img.setPointerCapture(e.pointerId);
  start = point(e);
});
img.addEventListener('pointerup', (e) => {
  if (!start) return;
  const end = point(e);
  const dx = end.x - start.x, dy = end.y - start.y;
  if (Math.hypot(dx, dy) < 0.012) {
    post('/api/input/tap', { x: end.x, y: end.y });
  } else {
    post('/api/input/swipe', { x1: start.x, y1: start.y, x2: end.x, y2: end.y });
  }
  start = null;
});
function point(e) {
  const rect = img.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height };
}
async function post(path, body) {
  try {
    await fetch(path, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  } catch (e) {}
}
</script>
</body>
</html>
